<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Repeatless">
  <title>Repeatless</title>
  <!-- Warm dark ground, matching the app's #1A1620 -->
  <rect width="64" height="64" rx="14" fill="#1A1620"/>
  <!-- Coral pad -->
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#FF5147"/>
  <!-- "Say it once": numeral 1 -->
  <path d="M25 18h6v28h-6z" fill="#FFFFFF"/>
  <path d="M25 18l-6 4.5V29l6-4.5z" fill="#FFFFFF"/>
  <!-- Sound waves -->
  <path d="M37 25a10 10 0 0 1 0 14" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M44 20a17 17 0 0 1 0 24" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
</svg>
