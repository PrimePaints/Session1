<title>Repeatless</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#1a1620;
    --panel:#241e2b;
    --panel-2:#2e2735;
    --line:#3a3242;
    --cream:#f4ece2;
    --muted:#a495ad;
    --muted-2:#7d7186;
    --rec:#ff5147;
    --amber:#ffb020;
    --shadow:0 10px 30px rgba(0,0,0,.45);
    --radius:20px;
    --tap:56px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
    --font:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --font-display:"Baloo 2",var(--font);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font);
    background:var(--ground);
    color:var(--cream);
    overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  #app{
    min-height:100%;
    display:flex;
    flex-direction:column;
    max-width:640px;
    margin:0 auto;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:calc(var(--safe-top) + 14px) 16px 12px;
    background:linear-gradient(180deg, var(--ground) 72%, rgba(26,22,32,0));
  }
  .brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0;}
  .power{
    width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #ff8a63, var(--rec));
    box-shadow:0 0 10px rgba(255,81,71,.7);
    flex:none;
  }
  .title{
    margin:0;font-size:24px;font-weight:800;letter-spacing:-.02em;
    font-family:var(--font-display);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .icon-btn{
    flex:none;
    display:inline-flex;align-items:center;justify-content:center;
    min-width:40px;height:40px;padding:0 10px;
    border:none;border-radius:12px;
    background:var(--panel);color:var(--cream);
    font-size:18px;font-family:var(--font);
    cursor:pointer;transition:transform .08s ease,background .15s ease;
  }
  .icon-btn:active{transform:scale(.92);}
  .icon-btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ---------- Grid ---------- */
  .grid{
    flex:1;
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    padding:6px 16px calc(var(--safe-bot) + 28px);
    align-content:start;
  }
  @media(min-width:520px){ .grid{grid-template-columns:1fr 1fr 1fr;} }

  .pad{
    position:relative;
    aspect-ratio:1/1;
    border:none;border-radius:var(--radius);
    color:#1a1620;
    font-family:var(--font);
    cursor:pointer;
    padding:14px;
    display:flex;flex-direction:column;justify-content:flex-end;
    text-align:left;
    box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.25), inset 0 -4px 0 rgba(0,0,0,.18);
    transition:transform .07s ease, filter .15s ease;
    overflow:hidden;
  }
  .pad:active{transform:translateY(2px) scale(.985);filter:brightness(1.05);}
  .pad:focus-visible{outline:3px solid var(--cream);outline-offset:3px;}
  .pad .label{
    font-size:17px;font-weight:800;line-height:1.15;letter-spacing:-.01em;
    text-wrap:balance;
    text-shadow:0 1px 0 rgba(255,255,255,.25);
    word-break:break-word;
  }
  .pad .num{
    font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
    opacity:.55;margin-bottom:auto;
  }
  .pad .more{
    position:absolute;top:8px;right:8px;
    width:34px;height:34px;border-radius:10px;border:none;
    background:rgba(26,22,32,.16);color:#1a1620;
    font-size:16px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .pad .more:active{background:rgba(26,22,32,.3);}
  /* playing state */
  .pad.playing{filter:brightness(1.12);}
  .pad.playing::after{
    content:"";position:absolute;inset:0;
    border-radius:var(--radius);
    box-shadow:inset 0 0 0 4px rgba(26,22,32,.55);
    animation:pulse 1s ease-in-out infinite;
  }
  @keyframes pulse{50%{box-shadow:inset 0 0 0 4px rgba(26,22,32,.15);}}
  .pad .bar{
    position:absolute;left:0;bottom:0;height:5px;width:0;
    background:rgba(26,22,32,.55);
  }

  .add{
    aspect-ratio:1/1;border-radius:var(--radius);
    border:2px dashed var(--line);background:transparent;color:var(--muted);
    font-family:var(--font);cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    transition:border-color .15s ease,color .15s ease,transform .07s ease;
  }
  .add:active{transform:scale(.97);}
  .add:hover{border-color:var(--muted);color:var(--cream);}
  .add:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .add .plus{font-size:34px;font-weight:700;line-height:1;}
  .add .cap{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;}

  .empty{
    grid-column:1/-1;
    text-align:center;color:var(--muted);
    padding:38px 20px 20px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .empty h2{margin:0;font-size:19px;color:var(--cream);font-weight:800;}
  .empty p{margin:0;font-size:14px;line-height:1.5;max-width:34ch;}

  /* ---------- Sheets & modals ---------- */
  .backdrop{
    position:fixed;inset:0;z-index:50;
    background:rgba(10,8,12,.6);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;
    padding:16px;
    animation:fade .18s ease;
  }
  .backdrop.center{align-items:center;}
  @keyframes fade{from{opacity:0;}}
  [hidden]{display:none !important;}

  .sheet{
    width:100%;max-width:480px;
    background:var(--panel);
    border-radius:22px;
    padding:10px;
    padding-bottom:calc(10px + var(--safe-bot));
    box-shadow:var(--shadow);
    animation:rise .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes rise{from{transform:translateY(18px);opacity:.4;}}
  .sheet h3{
    margin:6px 6px 12px;font-size:13px;font-weight:800;
    letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  }
  .row{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:15px 14px;border:none;border-radius:14px;
    background:transparent;color:var(--cream);
    font-family:var(--font);font-size:16px;font-weight:600;text-align:left;
    cursor:pointer;
  }
  .row:active{background:var(--panel-2);}
  .row .ico{font-size:19px;width:24px;text-align:center;flex:none;}
  .row.danger{color:#ff7a72;}

  .swatches{display:flex;flex-wrap:wrap;gap:12px;padding:8px 10px 14px;}
  .sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
  .sw[aria-pressed="true"]{border-color:var(--cream);}

  .card{
    width:100%;max-width:420px;
    background:var(--panel);border-radius:22px;
    padding:22px 20px calc(20px + var(--safe-bot));
    box-shadow:var(--shadow);
    animation:rise .22s cubic-bezier(.2,.8,.2,1);
    text-align:center;
  }
  .card h3{margin:0 0 4px;font-size:20px;font-weight:800;}
  .card .sub{margin:0 0 18px;font-size:14px;color:var(--muted);}

  .reclight{
    margin:6px auto 14px;
    width:96px;height:96px;border-radius:50%;
    background:var(--panel-2);
    display:flex;align-items:center;justify-content:center;
    font-size:38px;color:var(--muted);
    border:3px solid var(--line);
    transition:all .2s ease;
  }
  .reclight.live{
    background:radial-gradient(circle at 40% 35%, #ff8a63, var(--rec));
    color:#fff;border-color:transparent;
    box-shadow:0 0 0 8px rgba(255,81,71,.16),0 0 26px rgba(255,81,71,.5);
    animation:beat 1.1s ease-in-out infinite;
  }
  .reclight.done{background:#2fbf71;color:#fff;border-color:transparent;}
  @keyframes beat{50%{box-shadow:0 0 0 16px rgba(255,81,71,.04),0 0 26px rgba(255,81,71,.5);}}

  .timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:0 0 4px;}
  .meter{display:flex;gap:3px;justify-content:center;align-items:flex-end;height:26px;margin:10px 0 6px;}
  .meter i{width:4px;height:6px;border-radius:2px;background:var(--rec);opacity:.85;transition:height .06s linear;}

  .field{
    width:100%;padding:14px;border-radius:14px;
    background:var(--panel-2);border:1px solid var(--line);
    color:var(--cream);font-family:var(--font);font-size:17px;font-weight:600;
    text-align:center;margin:4px 0 18px;
  }
  .field:focus{outline:2px solid var(--amber);border-color:transparent;}

  .btns{display:flex;gap:10px;}
  .btn{
    flex:1;min-height:var(--tap);
    border:none;border-radius:14px;cursor:pointer;
    font-family:var(--font);font-size:16px;font-weight:800;
    transition:transform .07s ease,filter .15s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn:focus-visible{outline:2px solid var(--cream);outline-offset:2px;}
  .btn.primary{background:var(--rec);color:#fff;}
  .btn.go{background:var(--amber);color:#241400;}
  .btn.ghost{background:var(--panel-2);color:var(--cream);}
  .btn:disabled{opacity:.4;cursor:default;}

  .err{color:#ff9a92;font-size:14px;line-height:1.5;margin:0 0 14px;}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + var(--safe-bot));transform:translateX(-50%);
    background:var(--cream);color:#1a1620;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;
    box-shadow:var(--shadow);z-index:80;
    animation:fade .18s ease;
  }

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.001s !important;transition-duration:.001s !important;}
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="power" aria-hidden="true"></span>
      <h1 class="title" id="title">Repeatless</h1>
    </div>
    <button class="icon-btn" id="renameTitle" aria-label="Rename board">✎</button>
    <button class="icon-btn" id="menuBtn" aria-label="Backup and settings">⋯</button>
  </header>
  <main class="grid" id="grid" aria-label="Sound pads"></main>
</div>

<input type="file" id="restoreFile" accept="application/json,.json" hidden>

<script>
(function(){
  "use strict";

  /* ensure mobile viewport even though we can't edit <head> markup */
  (function(){
    var m=document.querySelector('meta[name="viewport"]');
    if(!m){m=document.createElement('meta');m.name='viewport';document.head.appendChild(m);}
    m.content='width=device-width, initial-scale=1, viewport-fit=cover';
  })();

  var PALETTE=["#ff6b61","#ffb020","#2dd4bf","#a78bfa","#a3e635","#f472b6","#38bdf8","#fb923c","#f9d94a","#5eead4"];

  /* ---------------- IndexedDB ---------------- */
  var DB=null;
  function openDB(){
    return new Promise(function(res,rej){
      var r=indexedDB.open("soundboard",1);
      r.onupgradeneeded=function(e){
        var db=e.target.result;
        if(!db.objectStoreNames.contains("pads")) db.createObjectStore("pads",{keyPath:"id"});
      };
      r.onsuccess=function(){DB=r.result;res(DB);};
      r.onerror=function(){rej(r.error);};
    });
  }
  function tx(mode){return DB.transaction("pads",mode).objectStore("pads");}
  function dbGetAll(){return new Promise(function(res,rej){var q=tx("readonly").getAll();q.onsuccess=function(){res(q.result||[]);};q.onerror=function(){rej(q.error);};});}
  function dbPut(v){return new Promise(function(res,rej){var q=tx("readwrite").put(v);q.onsuccess=function(){res();};q.onerror=function(){rej(q.error);};});}
  function dbDel(id){return new Promise(function(res,rej){var q=tx("readwrite").delete(id);q.onsuccess=function(){res();};q.onerror=function(){rej(q.error);};});}

  /* ---------------- State ---------------- */
  var pads=[];               // {id,label,color,order,blob,mime}
  var current=null;          // currently playing HTMLAudioElement
  var currentId=null;

  var grid=document.getElementById("grid");
  var titleEl=document.getElementById("title");

  /* ---------------- Title ---------------- */
  function loadTitle(){try{return localStorage.getItem("sb_title")||"Repeatless";}catch(e){return "Repeatless";}}
  function saveTitle(t){try{localStorage.setItem("sb_title",t);}catch(e){}}
  titleEl.textContent=loadTitle();
  document.title=titleEl.textContent;

  /* ---------------- Render ---------------- */
  function render(){
    grid.innerHTML="";
    if(pads.length===0){
      var e=document.createElement("div");
      e.className="empty";
      e.innerHTML='<h2>No buttons yet</h2><p>Record a clip once — a stern "brush your teeth," a warm "well done," whatever you say on repeat — then just tap to play it. Everything stays on this device.</p>';
      grid.appendChild(e);
    }
    pads.sort(function(a,b){return a.order-b.order;});
    pads.forEach(function(p,i){
      var b=document.createElement("button");
      b.className="pad";
      b.style.background=p.color;
      b.setAttribute("aria-label","Play "+p.label);
      b.innerHTML='<span class="num">'+String(i+1).padStart(2,"0")+'</span>'+
                  '<span class="bar"></span>'+
                  '<span class="label"></span>'+
                  '<button class="more" aria-label="Options for '+escAttr(p.label)+'">⋯</button>';
      b.querySelector(".label").textContent=p.label;
      b.addEventListener("click",function(ev){
        if(ev.target.closest(".more")) return;
        togglePlay(p,b);
      });
      b.querySelector(".more").addEventListener("click",function(ev){ev.stopPropagation();openPadSheet(p);});
      grid.appendChild(b);
    });
    var add=document.createElement("button");
    add.className="add";
    add.setAttribute("aria-label","Record a new button");
    add.innerHTML='<span class="plus">＋</span><span class="cap">Record</span>';
    add.addEventListener("click",function(){openRecorder(null);});
    grid.appendChild(add);
  }
  function escAttr(s){return String(s).replace(/"/g,"&quot;");}

  /* ---------------- Playback ---------------- */
  function stopCurrent(){
    if(current){try{current.pause();}catch(e){}current=null;}
    if(currentId){
      var el=[].slice.call(document.querySelectorAll(".pad")).find(function(n){return n.__id===currentId;});
    }
    document.querySelectorAll(".pad.playing").forEach(function(n){
      n.classList.remove("playing");
      var bar=n.querySelector(".bar"); if(bar) bar.style.width="0";
    });
    currentId=null;
  }
  function togglePlay(p,btn){
    if(currentId===p.id){stopCurrent();return;}
    stopCurrent();
    var url=URL.createObjectURL(p.blob);
    var a=new Audio(url);
    current=a;currentId=p.id;
    btn.classList.add("playing");
    var bar=btn.querySelector(".bar");
    a.addEventListener("timeupdate",function(){
      if(a.duration && bar) bar.style.width=(a.currentTime/a.duration*100)+"%";
    });
    var done=function(){URL.revokeObjectURL(url);if(currentId===p.id)stopCurrent();};
    a.addEventListener("ended",done);
    a.addEventListener("error",done);
    a.play().catch(function(){done();});
  }

  /* ---------------- Recorder ---------------- */
  var recBackdrop,mediaStream,recorder,chunks,recTimer,recSecs,analyser,rafId,recordedBlob,recordedMime,recTargetId;
  var MAX_SECS=30;

  function pickMime(){
    var opts=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/aac",""];
    for(var i=0;i<opts.length;i++){
      if(opts[i]==="" || (window.MediaRecorder && MediaRecorder.isTypeSupported(opts[i]))) return opts[i];
    }
    return "";
  }

  function openRecorder(targetId){
    recTargetId=targetId;
    recordedBlob=null;recordedMime=null;
    recBackdrop=modal(
      '<div class="card" role="dialog" aria-modal="true" aria-label="Record clip">'+
        '<div class="reclight" id="rl">🎙️</div>'+
        '<p class="timer" id="rtimer">0:00</p>'+
        '<div class="meter" id="rmeter" hidden></div>'+
        '<p class="sub" id="rsub">Tap the button and say your line.</p>'+
        '<p class="err" id="rerr" hidden></p>'+
        '<div class="btns">'+
          '<button class="btn ghost" id="rcancel">Cancel</button>'+
          '<button class="btn primary" id="rmain">Record</button>'+
        '</div>'+
      '</div>', true);
    var main=document.getElementById("rmain");
    var cancel=document.getElementById("rcancel");
    cancel.addEventListener("click",closeRecorder);
    main.addEventListener("click",onRecMain);
  }

  function onRecMain(){
    var main=document.getElementById("rmain");
    var state=main.dataset.state||"idle";
    if(state==="idle"){ startRec(); }
    else if(state==="recording"){ stopRec(); }
    else if(state==="review"){ saveRec(); }
  }

  function startRec(){
    var err=document.getElementById("rerr");
    err.hidden=true;
    if(!navigator.mediaDevices||!window.MediaRecorder){
      showErr("This browser can't record audio. Try Safari or Chrome.");return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
      mediaStream=stream;chunks=[];recordedMime=pickMime();
      try{recorder=recordedMime?new MediaRecorder(stream,{mimeType:recordedMime}):new MediaRecorder(stream);}
      catch(e){recorder=new MediaRecorder(stream);}
      recordedMime=recorder.mimeType||recordedMime||"audio/webm";
      recorder.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
      recorder.onstop=function(){
        recordedBlob=new Blob(chunks,{type:recordedMime});
        toReview();
      };
      recorder.start();
      startMeter(stream);
      recSecs=0;
      document.getElementById("rtimer").textContent="0:00";
      recTimer=setInterval(function(){
        recSecs++;
        document.getElementById("rtimer").textContent=fmt(recSecs);
        if(recSecs>=MAX_SECS) stopRec();
      },1000);
      var main=document.getElementById("rmain");
      main.dataset.state="recording";main.textContent="Stop";
      document.getElementById("rl").className="reclight live";
      document.getElementById("rl").textContent="●";
      document.getElementById("rsub").textContent="Recording… tap Stop when you're done.";
    }).catch(function(e){
      if(e && (e.name==="NotAllowedError"||e.name==="SecurityError"))
        showErr("Microphone blocked. Allow mic access in your browser settings, then try again.");
      else showErr("Couldn't reach the microphone. Check it isn't in use by another app.");
    });
  }

  function stopRec(){
    if(recTimer){clearInterval(recTimer);recTimer=null;}
    stopMeter();
    if(recorder&&recorder.state!=="inactive"){try{recorder.stop();}catch(e){}}
    if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop();});mediaStream=null;}
  }

  function toReview(){
    var main=document.getElementById("rmain");
    main.dataset.state="review";main.textContent="Use this";
    main.className="btn go";
    document.getElementById("rl").className="reclight done";
    document.getElementById("rl").textContent="✓";
    document.getElementById("rsub").textContent="Sounds good? Save it — or tap Redo to try again.";
    var cancel=document.getElementById("rcancel");
    cancel.textContent="Redo";
    cancel.onclick=function(){ resetRecorder(); };
    // preview play
    var prev=document.createElement("button");
    prev.className="btn ghost";prev.textContent="▶ Play";prev.style.flex="0 0 auto";
    prev.addEventListener("click",function(){
      var u=URL.createObjectURL(recordedBlob);var a=new Audio(u);
      a.onended=function(){URL.revokeObjectURL(u);};a.play();
    });
    var btns=main.parentNode;
    if(!document.getElementById("rprev")){prev.id="rprev";btns.insertBefore(prev,main);}
  }

  function resetRecorder(){
    recordedBlob=null;
    var main=document.getElementById("rmain");
    main.dataset.state="idle";main.textContent="Record";main.className="btn primary";
    var cancel=document.getElementById("rcancel");
    cancel.textContent="Cancel";cancel.onclick=closeRecorder;
    var prev=document.getElementById("rprev");if(prev)prev.remove();
    document.getElementById("rl").className="reclight";document.getElementById("rl").textContent="🎙️";
    document.getElementById("rtimer").textContent="0:00";
    document.getElementById("rsub").textContent="Tap the button and say your line.";
  }

  function saveRec(){
    if(!recordedBlob){resetRecorder();return;}
    var blob=recordedBlob,mime=recordedMime;
    closeRecorder();
    if(recTargetId){
      var p=pads.find(function(x){return x.id===recTargetId;});
      if(p){p.blob=blob;p.mime=mime;dbPut(p).then(function(){render();toast("Re-recorded");});}
    }else{
      askName("New button","What should this say? (a short label)","",function(name){
        var p={id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),
               label:name||("Clip "+(pads.length+1)),
               color:PALETTE[pads.length%PALETTE.length],
               order:(pads.length?Math.max.apply(null,pads.map(function(x){return x.order;}))+1:0),
               blob:blob,mime:mime};
        pads.push(p);
        dbPut(p).then(function(){render();toast("Saved");});
      });
    }
  }

  function closeRecorder(){
    if(recTimer){clearInterval(recTimer);recTimer=null;}
    stopMeter();
    if(recorder&&recorder.state!=="inactive"){try{recorder.stop();}catch(e){}}
    if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop();});mediaStream=null;}
    recorder=null;
    if(recBackdrop){recBackdrop.remove();recBackdrop=null;}
  }
  function showErr(msg){
    var e=document.getElementById("rerr");if(e){e.textContent=msg;e.hidden=false;}
  }

  /* mic level meter */
  function startMeter(stream){
    var meter=document.getElementById("rmeter");
    if(!meter) return;
    meter.hidden=false;meter.innerHTML="";
    var bars=[];for(var i=0;i<9;i++){var b=document.createElement("i");meter.appendChild(b);bars.push(b);}
    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      var ctx=new AC();var src=ctx.createMediaStreamSource(stream);
      analyser=ctx.createAnalyser();analyser.fftSize=64;src.connect(analyser);
      var data=new Uint8Array(analyser.frequencyBinCount);
      var reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches;
      analyser.__ctx=ctx;
      var loop=function(){
        analyser.getByteFrequencyData(data);
        for(var j=0;j<bars.length;j++){
          var v=data[j*2]||0;var h=reduce?12:6+Math.round(v/255*20);
          bars[j].style.height=h+"px";
        }
        rafId=requestAnimationFrame(loop);
      };
      loop();
    }catch(e){}
  }
  function stopMeter(){
    if(rafId){cancelAnimationFrame(rafId);rafId=null;}
    if(analyser&&analyser.__ctx){try{analyser.__ctx.close();}catch(e){}analyser=null;}
    var meter=document.getElementById("rmeter");if(meter)meter.hidden=true;
  }

  /* ---------------- Pad actions ---------------- */
  function openPadSheet(p){
    var b=sheet(
      '<h3>'+escHtml(p.label)+'</h3>'+
      '<button class="row" data-a="play"><span class="ico">▶</span>Play</button>'+
      '<button class="row" data-a="rename"><span class="ico">✎</span>Rename</button>'+
      '<button class="row" data-a="rerec"><span class="ico">🎙️</span>Re-record</button>'+
      '<button class="row" data-a="color"><span class="ico">🎨</span>Change colour</button>'+
      '<button class="row danger" data-a="del"><span class="ico">🗑️</span>Delete</button>'
    );
    b.querySelectorAll(".row").forEach(function(r){
      r.addEventListener("click",function(){
        var a=r.dataset.a;b.remove();
        if(a==="play"){var el=findPadEl(p.id);if(el)togglePlay(p,el);}
        else if(a==="rename"){askName("Rename","What should this say?",p.label,function(n){if(n){p.label=n;dbPut(p).then(function(){render();});}});}
        else if(a==="rerec"){openRecorder(p.id);}
        else if(a==="color"){openColor(p);}
        else if(a==="del"){confirmDelete(p);}
      });
    });
  }
  function findPadEl(id){
    var idx=pads.findIndex(function(x){return x.id===id;});
    return grid.querySelectorAll(".pad")[idx]||null;
  }
  function openColor(p){
    var sw=PALETTE.map(function(c){return '<button class="sw" style="background:'+c+'" data-c="'+c+'" aria-label="colour" aria-pressed="'+(c===p.color)+'"></button>';}).join("");
    var b=sheet('<h3>Pick a colour</h3><div class="swatches">'+sw+'</div>');
    b.querySelectorAll(".sw").forEach(function(s){
      s.addEventListener("click",function(){p.color=s.dataset.c;dbPut(p).then(function(){render();b.remove();});});
    });
  }
  function confirmDelete(p){
    var b=modal(
      '<div class="card" role="dialog" aria-modal="true">'+
        '<h3>Delete this button?</h3>'+
        '<p class="sub">"'+escHtml(p.label)+'" and its recording will be removed. This can\'t be undone.</p>'+
        '<div class="btns"><button class="btn ghost" id="dc">Keep</button><button class="btn primary" id="dd">Delete</button></div>'+
      '</div>',true);
    document.getElementById("dc").addEventListener("click",function(){b.remove();});
    document.getElementById("dd").addEventListener("click",function(){
      if(currentId===p.id)stopCurrent();
      pads=pads.filter(function(x){return x.id!==p.id;});
      dbDel(p.id).then(function(){b.remove();render();toast("Deleted");});
    });
  }

  /* ---------------- Menu (backup / restore) ---------------- */
  document.getElementById("menuBtn").addEventListener("click",function(){
    var b=sheet(
      '<h3>Board</h3>'+
      '<button class="row" data-a="backup"><span class="ico">⬇️</span>Back up to a file</button>'+
      '<button class="row" data-a="restore"><span class="ico">⬆️</span>Restore from a file</button>'
    );
    b.querySelectorAll(".row").forEach(function(r){
      r.addEventListener("click",function(){var a=r.dataset.a;b.remove();if(a==="backup")backup();else restore();});
    });
  });
  document.getElementById("renameTitle").addEventListener("click",function(){
    askName("Rename board","Name your soundboard",titleEl.textContent,function(n){
      if(n){titleEl.textContent=n;document.title=n;saveTitle(n);}
    });
  });

  function blobToDataURL(blob){return new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(blob);});}
  function backup(){
    if(!pads.length){toast("Nothing to back up yet");return;}
    Promise.all(pads.map(function(p){return blobToDataURL(p.blob).then(function(d){
      return {id:p.id,label:p.label,color:p.color,order:p.order,mime:p.mime,audio:d};
    });})).then(function(items){
      var data={app:"soundboard",version:1,title:titleEl.textContent,pads:items};
      var blob=new Blob([JSON.stringify(data)],{type:"application/json"});
      var url=URL.createObjectURL(blob);var a=document.createElement("a");
      a.href=url;a.download=(titleEl.textContent||"soundboard").replace(/[^\w-]+/g,"-").toLowerCase()+"-backup.json";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);},1000);
      toast("Backup downloaded");
    });
  }
  var restoreInput=document.getElementById("restoreFile");
  function restore(){restoreInput.value="";restoreInput.click();}
  restoreInput.addEventListener("change",function(){
    var f=restoreInput.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var data=JSON.parse(r.result);
        if(!data||!Array.isArray(data.pads))throw 0;
        Promise.all(data.pads.map(function(it){
          return fetch(it.audio).then(function(x){return x.blob();}).then(function(blob){
            return {id:it.id||(crypto.randomUUID?crypto.randomUUID():String(Math.random())),
                    label:it.label||"Clip",color:it.color||PALETTE[0],order:it.order||0,
                    mime:it.mime||blob.type,blob:blob};
          });
        })).then(function(loaded){
          return Promise.all(loaded.map(function(p){return dbPut(p);})).then(function(){
            var byId={};pads.forEach(function(p){byId[p.id]=p;});loaded.forEach(function(p){byId[p.id]=p;});
            pads=Object.keys(byId).map(function(k){return byId[k];});
            if(data.title){titleEl.textContent=data.title;document.title=data.title;saveTitle(data.title);}
            render();toast("Restored "+loaded.length+" button"+(loaded.length===1?"":"s"));
          });
        });
      }catch(e){toast("That file didn't look like a backup");}
    };
    r.readAsText(f);
  });

  /* ---------------- Small UI helpers ---------------- */
  function modal(html,center){
    var bd=document.createElement("div");
    bd.className="backdrop"+(center?" center":"");
    bd.innerHTML=html;
    bd.addEventListener("click",function(e){if(e.target===bd)bd.remove();});
    document.body.appendChild(bd);
    return bd;
  }
  function sheet(html){
    var bd=document.createElement("div");
    bd.className="backdrop";
    bd.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
    bd.addEventListener("click",function(e){if(e.target===bd)bd.remove();});
    document.body.appendChild(bd);
    return bd;
  }
  function askName(title,sub,value,cb){
    var b=modal(
      '<div class="card" role="dialog" aria-modal="true">'+
        '<h3>'+escHtml(title)+'</h3>'+
        '<p class="sub">'+escHtml(sub)+'</p>'+
        '<input class="field" id="nf" maxlength="40" value="'+escAttr(value||"")+'" placeholder="e.g. Brush your teeth!">'+
        '<div class="btns"><button class="btn ghost" id="ncancel">Cancel</button><button class="btn go" id="nok">Save</button></div>'+
      '</div>',true);
    var f=document.getElementById("nf");
    setTimeout(function(){f.focus();f.select();},60);
    f.addEventListener("keydown",function(e){if(e.key==="Enter"){done();}});
    document.getElementById("ncancel").addEventListener("click",function(){b.remove();});
    document.getElementById("nok").addEventListener("click",done);
    function done(){var v=f.value.trim();b.remove();cb(v);}
  }
  var toastTimer;
  function toast(msg){
    var old=document.querySelector(".toast");if(old)old.remove();
    var t=document.createElement("div");t.className="toast";t.textContent=msg;
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){t.remove();},1800);
  }
  function fmt(s){var m=Math.floor(s/60);var ss=s%60;return m+":"+(ss<10?"0":"")+ss;}
  function escHtml(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}

  /* ---------------- Boot ---------------- */
  openDB().then(dbGetAll).then(function(list){
    pads=list||[];render();
  }).catch(function(){
    grid.innerHTML='<div class="empty"><h2>Storage unavailable</h2><p>This browser is blocking local storage, so clips can\'t be saved. Try opening the page directly in Safari or Chrome (not inside another app\'s browser).</p></div>';
  });
})();
</script>
